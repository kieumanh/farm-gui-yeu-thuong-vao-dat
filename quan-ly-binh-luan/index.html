<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Duyệt bình luận | Farm Yêu Thương</title>
<style>
:root{--forest-900:#1a3223;--forest-700:#2e5739;--leaf-200:#cfe0c6;--paper-50:#faf7ec;--paper-100:#f4efdd;--paper-300:#d9cfae;--basalt-600:#9c5433;--sun-100:#fbeed3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper-50);color:var(--forest-900);font:16px/1.6 Georgia,"Times New Roman",serif}
main{max-width:780px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 4px}
.sub{margin:0 0 20px;color:var(--forest-700)}
.box{background:#fff;border:1px solid var(--paper-300);border-radius:14px;padding:18px}
label{display:block;font-weight:700;margin-bottom:6px}
input{width:100%;padding:11px 12px;border:1px solid var(--paper-300);border-radius:10px;font:inherit;background:#fff;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--leaf-200);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:10px 16px;border-radius:999px;border:1px solid var(--forest-700);cursor:pointer;min-height:44px}
.btn:disabled{opacity:.6;cursor:wait}
.primary{background:var(--forest-900);color:var(--paper-50)}
.ghost{background:transparent;color:var(--forest-900)}
.danger{background:transparent;color:var(--basalt-600);border-color:var(--basalt-600)}
#login-form .btn{margin-top:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button[aria-pressed="true"]{background:var(--forest-900);color:var(--paper-50)}
.card{background:#fff;border:1px solid var(--paper-300);border-radius:14px;padding:16px;margin-bottom:12px}
.card-head{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline}
.card-head time{color:var(--forest-700);font-size:.9rem}
.meta{margin:4px 0 10px;font-size:.9rem;color:var(--forest-700);overflow-wrap:anywhere}
.body{margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper-100);border-radius:10px;padding:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:20px;text-align:center;color:var(--forest-700)}
#status{min-height:1.6em;margin:12px 0;font-weight:700;color:var(--forest-700)}
#status.bad{color:var(--basalt-600)}
.note{font-size:.9rem;color:var(--forest-700);margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Duyệt bình luận</h1>
  <p class="sub">Trang dành riêng cho chủ website Farm Yêu Thương.</p>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="login" class="box" aria-label="Đăng nhập quản trị">
    <form id="login-form">
      <label for="token">Mật khẩu quản trị</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Đăng nhập</button>
    </form>
  </section>

  <section id="panel" hidden aria-label="Danh sách bình luận">
    <div class="bar">
      <div class="tabs">
        <button class="btn ghost" type="button" data-tab="pending" aria-pressed="true">Chờ duyệt</button>
        <button class="btn ghost" type="button" data-tab="approved" aria-pressed="false">Đã duyệt</button>
        <button class="btn ghost" type="button" data-tab="rejected" aria-pressed="false">Đã từ chối</button>
      </div>
      <button id="logout" class="btn ghost" type="button">Đăng xuất</button>
    </div>
    <div id="list" aria-live="polite"></div>
    <p class="note">Email và số điện thoại chỉ hiển thị ở trang này, không công khai trên website.</p>
  </section>
</main>
<script src="/assets/admin-comments.js" defer></script>
</body>
</html>
