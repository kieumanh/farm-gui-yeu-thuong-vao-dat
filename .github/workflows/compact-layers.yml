name: Farm UI compact layer explanations v2.2.1
on:
  push:
    paths:
      - "scripts/compact-layers.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted three-layer UI update
        run: node scripts/compact-layers.mjs
      - name: Validate JavaScript and diff
        run: |
          node --check assets/app.js
          git diff --check
          grep -q "v2.2.1" index.html
          grep -q "v2.2.1" phien-ban/index.html
          test ! -e _worker.js
      - name: Publish to GitHub main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/style.css assets/app.js
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): compact three-layer explanations, v2.2.1"
          git push origin HEAD:main
