name: Farm Music Header v2.2.2
on:
  push:
    paths:
      - "scripts/music-header-v222.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Move music into header and enhance volume control
        run: node scripts/music-header-v222.mjs
      - name: Validate JavaScript and HTML
        run: |
          node --check assets/music.mjs
          node --check assets/app.js
          git diff --check
          grep -q '?v=2.2.2' index.html
          grep -q 'v2.2.2' phien-ban/index.html
          grep -q 'id="music-mute"' index.html
          test ! -e _worker.js
      - name: Publish to GitHub main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/music.mjs
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "feat(ui): dock music in header with volume and mute v2.2.2"
          git push origin HEAD:main
