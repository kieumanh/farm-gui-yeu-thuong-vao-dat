name: Farm Music Floating v2.2.3
on:
  push:
    paths:
      - "scripts/music-floating-v223.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relocate-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore music to bottom-left without header obstruction
        run: node scripts/music-floating-v223.mjs
      - name: Validate files and layouts
        run: |
          test -s assets/music-floating-v223.css
          node --check assets/music.mjs
          node --check assets/app.js
          git diff --check
          grep -q 'music-floating-v223.css?v=2.2.3' index.html
          grep -q 'v2.2.3' phien-ban/index.html
          test ! -e _worker.js
      - name: Publish to main (Cloudflare Pages auto-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): return minimal music controller to bottom-left v2.2.3"
          git push origin HEAD:main
